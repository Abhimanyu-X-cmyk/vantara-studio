<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vantara Studio - AI Video Generator</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --border-color: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #0ea5e9;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .card {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 520px;
            box-sizing: border-box;
            border: 1px solid var(--border-color);
        }

        h2 {
            margin-top: 0;
            color: var(--text-main);
            font-size: 24px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 20px;
        }

        .subtitle a {
            color: var(--accent);
            text-decoration: none;
        }

        .subtitle a:hover {
            text-decoration: underline;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 6px;
            margin-top: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--bg-color);
            color: var(--text-main);
            font-size: 15px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--accent);
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 22px;
            border-radius: 8px;
            border: none;
            background: var(--accent);
            color: var(--bg-color);
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        button:hover {
            background: var(--accent-hover);
        }

        button:active {
            transform: scale(0.98);
        }

        #status {
            margin-top: 18px;
            font-size: 14px;
            color: var(--text-muted);
            text-align: center;
            min-height: 20px;
        }

        video {
            width: 100%;
            margin-top: 20px;
            border-radius: 8px;
            display: none;
            border: 1px solid var(--border-color);
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>🎬 Vantara AI Studio</h2>
        <div class="subtitle">
            Powered by Vantara Education &bull; <a href="https://abhimanyu-x-cmyk.github.io/vantara-studio/" target="_blank">vantara-studio</a>
        </div>
        
        <label for="apiUrl">Colab Backend Tunnel URL</label>
        <input type="text" id="apiUrl" placeholder="e.g. https://xxxx.trycloudflare.com/generate">

        <label for="promptInput">Video Topic / Prompt</label>
        <input type="text" id="promptInput" placeholder="e.g. The Physics of Black Holes">
        
        <button onclick="generateVideo()">Generate AI Video</button>
        
        <div id="status">Status: Ready to build...</div>
        <video id="resultVideo" controls></video>
    </div>

    <script>
        async function generateVideo() {
            const prompt = document.getElementById('promptInput').value.trim();
            const apiUrl = document.getElementById('apiUrl').value.trim();
            const status = document.getElementById('status');
            const videoElem = document.getElementById('resultVideo');

            if (!apiUrl) {
                alert('Please paste your live Cloudflare Tunnel URL from Google Colab!');
                return;
            }

            if (!prompt) {
                alert('Please type a topic or prompt for your video!');
                return;
            }

            status.innerText = "⏳ Connecting to Colab & building your video (~30s)...";
            videoElem.style.display = 'none';

            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: prompt })
                });

                if (!response.ok) throw new Error("Backend video generation failed.");

                const blob = await response.blob();
                const videoUrl = URL.createObjectURL(blob);
                
                videoElem.src = videoUrl;
                videoElem.style.display = 'block';
                status.innerText = "🎉 Success! Your video is ready below.";
            } catch (error) {
                status.innerText = "❌ Error: Make sure your Colab cell is running and your URL ends with /generate";
            }
        }
    </script>
</body>
</html>
